[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_FROM_EMAIL"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

